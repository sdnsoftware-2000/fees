
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#213b5b">
<title>Fee Register | Student Accounts</title>

<style>
/* =========================================================
   1. DESIGN SYSTEM
========================================================= */
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --surface-soft: #f8fafc;
  --ink: #202b3c;
  --muted: #68758a;
  --line: #e1e6ed;
  --navy: #213b5b;
  --navy-hover: #304f73;
  --rose: #a66b79;
  --rose-bg: #f7edf0;
  --green: #287653;
  --green-bg: #eaf5ef;
  --amber: #94651b;
  --amber-bg: #fff5df;
  --red: #a33e45;
  --red-bg: #fff0f0;
  --radius: 14px;
  --shadow: 0 5px 22px rgba(29,49,69,.055);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.55 Inter, "Segoe UI", Arial, sans-serif;
}

button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible,
select:focus-visible, textarea:focus-visible {
  outline: 3px solid #8ba8d6;
  outline-offset: 2px;
}

button:disabled { opacity: .55; cursor: not-allowed; }

.shell {
  max-width: 1450px;
  margin: auto;
  padding: 26px 24px 40px;
}

.masthead {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 22px;
  flex-wrap: wrap;
  margin-bottom: 25px;
}

.brand { display: flex; align-items: center; gap: 13px; }

.logo {
  width: 48px;
  height: 48px;
  display: grid;
  place-items: center;
  border-radius: 14px;
  background: var(--navy);
  color: white;
}

.eyebrow {
  color: var(--rose);
  text-transform: uppercase;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .15em;
}

h1, h2, h3, p { margin-top: 0; }

h1 {
  margin: 3px 0;
  font: 500 30px/1.2 Georgia, serif;
  letter-spacing: -.5px;
}

.subtitle { margin: 5px 0 0; color: var(--muted); }

.top-actions, .button-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

button {
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--surface);
  color: var(--ink);
  padding: 9px 12px;
  font-weight: 650;
  transition: background .15s, border-color .15s;
}

button:hover { border-color: #9caabd; background: #f8fafc; }

button.primary {
  background: var(--navy);
  border-color: var(--navy);
  color: white;
}

button.primary:hover { background: var(--navy-hover); }

button.soft {
  background: var(--rose-bg);
  border-color: #ead7dc;
  color: #814e5b;
}

button.danger { color: var(--red); }

.btn {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  gap: 7px;
}

.icon {
  display: inline-block;
  width: 16px;
  height: 16px;
  flex: 0 0 16px;
  vertical-align: middle;
}

.stats {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 14px;
  margin-bottom: 22px;
}

.stat {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px;
  box-shadow: var(--shadow);
  min-width: 0;
}

.stat-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.stat-icon {
  display: grid;
  place-items: center;
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: #edf2f8;
  color: var(--navy);
}

.stat-label { font-size: 12px; color: var(--muted); font-weight: 650; }

.stat-value {
  font-size: clamp(20px, 2vw, 27px);
  line-height: 1.3;
  font-weight: 750;
  letter-spacing: -.6px;
  margin-top: 12px;
  overflow-wrap: anywhere;
}

.stat-hint { font-size: 11px; color: var(--muted); margin-top: 5px; }

.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
}

.toolbar {
  padding: 16px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  border-bottom: 1px solid var(--line);
}

input, select, textarea {
  width: 100%;
  min-width: 0;
  border: 1px solid #d7dee8;
  background: white;
  color: var(--ink);
  border-radius: 9px;
  padding: 10px 11px;
}

input::placeholder, textarea::placeholder { color: #98a2b1; }

.search-box {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 1;
  min-width: 220px;
  border: 1px solid #d7dee8;
  border-radius: 10px;
  padding-left: 12px;
  color: var(--muted);
}

.search-box input { border: 0; outline: 0; box-shadow: none; }

.search-box:focus-within {
  outline: 3px solid #8ba8d666;
}

.search-box input:focus-visible { outline: none; }

.toolbar select { width: auto; min-width: 160px; }

.filter-section { padding: 13px 16px; border-bottom: 1px solid var(--line); }

.filter-heading {
  color: var(--muted);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .08em;
  text-transform: uppercase;
  margin-bottom: 9px;
}

.filters { display: flex; flex-wrap: wrap; gap: 7px; }

.filter {
  border-radius: 999px;
  padding: 7px 12px;
  font-size: 12px;
}

.filter.active { background: var(--navy); color: white; border-color: var(--navy); }

.results-bar {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  padding: 14px 16px;
  align-items: center;
}

.small { color: var(--muted); font-size: 12px; }

.table-wrap { width: 100%; overflow-x: auto; }

table { width: 100%; border-collapse: collapse; min-width: 850px; }

th {
  background: var(--surface-soft);
  color: var(--muted);
  font-size: 10px;
  text-align: left;
  text-transform: uppercase;
  letter-spacing: .07em;
  padding: 13px 15px;
  white-space: nowrap;
}

td {
  padding: 14px 15px;
  border-top: 1px solid #edf0f4;
  vertical-align: middle;
}

tbody tr:hover { background: #fbfcfe; }

.student {
  font-weight: 750;
  color: var(--navy);
  cursor: pointer;
  overflow-wrap: anywhere;
}

.student:hover { text-decoration: underline; }

.subline { font-size: 11px; color: var(--muted); margin-top: 4px; }

.course {
  display: inline-block;
  border: 1px solid #dce3ed;
  background: #f5f7fa;
  padding: 4px 8px;
  border-radius: 6px;
  font-size: 11px;
  white-space: nowrap;
}

.money { font-variant-numeric: tabular-nums; font-weight: 750; white-space: nowrap; }

.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border-radius: 999px;
  padding: 5px 9px;
  font-size: 11px;
  font-weight: 750;
  white-space: nowrap;
}

.badge.green { color: var(--green); background: var(--green-bg); }
.badge.amber { color: var(--amber); background: var(--amber-bg); }
.badge.red { color: var(--red); background: var(--red-bg); }
.badge.neutral { color: #5d6878; background: #eef1f5; }

.row-actions { display: flex; gap: 6px; }

.icon-btn { padding: 7px 9px; font-size: 12px; }

.empty { padding: 48px 20px; text-align: center; color: var(--muted); }
.empty .icon { width: 30px; height: 30px; margin-bottom: 10px; }

.footer {
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  color: var(--muted);
  font-size: 11px;
  padding: 16px 3px;
}

.view { padding: 22px; }

.view-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 15px;
  flex-wrap: wrap;
}

.view h2 { font: 500 27px Georgia, serif; margin: 10px 0 6px; overflow-wrap: anywhere; }

.detail-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
  margin: 22px 0;
}

.mini { border: 1px solid var(--line); border-radius: 12px; padding: 15px; min-width: 0; }
.mini label { display: block; color: var(--muted); font-size: 11px; margin-bottom: 6px; }
.mini strong { overflow-wrap: anywhere; }

.section-title { font-weight: 800; margin: 25px 0 11px; }

.payment-list { display: grid; gap: 9px; }

.payment {
  display: grid;
  grid-template-columns: 22px minmax(0, 1fr) auto auto;
  align-items: center;
  gap: 12px;
  border: 1px solid var(--line);
  border-radius: 11px;
  padding: 13px;
}

.payment input[type="checkbox"] { width: 17px; height: 17px; accent-color: var(--green); }
.payment-note { font-size: 12px; color: var(--muted); margin-top: 4px; overflow-wrap: anywhere; }
.payment-actions { display: flex; gap: 5px; }

.notice {
  padding: 12px 14px;
  background: #f7f9fc;
  border: 1px solid var(--line);
  border-radius: 10px;
  color: var(--muted);
  font-size: 12px;
  margin: 14px 0;
}

.warning { color: var(--amber); }

.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(23,35,52,.60);
  display: grid;
  place-items: center;
  padding: 16px;
  z-index: 100;
}

.modal {
  width: min(600px, 100%);
  max-height: 90vh;
  overflow: auto;
  background: white;
  border-radius: 16px;
  padding: 24px;
  box-shadow: 0 20px 80px #0003;
}

.modal h3 { font: 500 25px Georgia, serif; margin-bottom: 7px; }
.modal-subtitle { font-size: 12px; color: var(--muted); margin-bottom: 20px; }

.form-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}

.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label { font-size: 12px; font-weight: 750; color: #526075; }
.field.full { grid-column: 1 / -1; }

.field input[type="checkbox"] { width: auto; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 22px; }

.toast {
  position: fixed;
  bottom: 22px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--ink);
  color: white;
  padding: 12px 17px;
  border-radius: 10px;
  box-shadow: var(--shadow);
  z-index: 200;
  max-width: calc(100% - 28px);
  text-align: center;
}

.hidden { display: none !important; }

@media (max-width: 900px) {
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .top-actions { justify-content: flex-start; }
}

@media (max-width: 600px) {
  .shell { padding: 17px 11px 25px; }
  .masthead { flex-direction: column; }
  h1 { font-size: 27px; }
  .top-actions { width: 100%; }
  .top-actions button { flex: 1 1 auto; }
  .stats { gap: 9px; }
  .stat { padding: 12px; }
  .stat-value { font-size: 20px; }
  .stat-hint { font-size: 10px; }
  .toolbar { padding: 12px; }
  .search-box { min-width: 100%; }
  .toolbar select { flex: 1; }
  .detail-grid { grid-template-columns: 1fr; }
  .form-grid { grid-template-columns: 1fr; }
  .field.full { grid-column: auto; }
  .payment { grid-template-columns: 22px minmax(0, 1fr); }
  .payment > .badge, .payment .payment-actions { grid-column: 2; justify-self: start; }
  .view { padding: 15px; }
  .modal { padding: 19px; }
}

@media print {
  body { background: white; }
  .shell { max-width: none; padding: 0; }
  .top-actions, .toolbar, .filter-section, .row-actions,
  .footer, .detail-actions, .payment-actions { display: none !important; }
  .panel, .stat { box-shadow: none; }
  .stats { break-inside: avoid; }
  table { min-width: 0; }
  th, td { padding: 7px; font-size: 10px; }
  .masthead { margin-bottom: 10px; }
  .view { padding: 0; }
}
</style>
</head>

<body>
<main class="shell">

<header class="masthead">
  <div class="brand">
    <div class="logo" id="brandIcon"></div>
    <div>
      <div class="eyebrow">Student accounts · Private register</div>
      <h1>Fee Register</h1>
      <p class="subtitle">Manage students, payments and outstanding fees.</p>
    </div>
  </div>

  <div class="top-actions">
    <button class="btn" onclick="backupJSON()" title="Download a JSON backup">
      <span data-icon="download"></span> Backup
    </button>
    <button class="btn" onclick="document.getElementById('importFile').click()">
      <span data-icon="upload"></span> Import
    </button>
    <input id="importFile" type="file" accept=".json,application/json" hidden>
    <button class="btn" onclick="exportCSV()">
      <span data-icon="file"></span> Export CSV
    </button>
    <button class="btn" onclick="window.print()">
      <span data-icon="print"></span> Print
    </button>
    <button class="btn primary" onclick="openStudentForm()">
      <span data-icon="add"></span> Add student
    </button>
  </div>
</header>

<section class="stats" id="stats"></section>
<section class="panel" id="app"></section>

<footer class="footer">
  <span>Autosaves in this browser. Export regular backups.</span>
  <span>Balances are calculated only when a valid total fee is entered.</span>
</footer>

</main>

<div id="modalRoot"></div>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

<script>
"use strict";

/* =========================================================
   1. ICONS
   Inline SVG means icons work without internet access.
========================================================= */

const ICONS = {

  eye: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>',
  trash: '<path d="M3 6h18M8 6V4h8v2m3 0-1 15H6L5 6m4 4v7m6-7v7"/>',
  download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5M12 15V3"/>',
  upload: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5M12 3v12"/>',
  print: '<path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v7H6z"/>',
  file: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6M8 13h8m-8 4h8"/>',
  check: '<path d="m5 12 4 4L19 6"/>',
  close: '<path d="m18 6-12 12M6 6l12 12"/>',
  back: '<path d="m15 18-6-6 6-6M9 12h12"/>',
  calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',
  money: '<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="12" cy="12" r="3"/><path d="M7 9h.01M17 15h.01"/>',
  alert: '<path d="m12 3 10 18H2L12 3Z"/><path d="M12 9v4m0 4h.01"/>'
};

function icon(name, size = 16) {
  const content = ICONS[name];
  if (!content) return "";

  return `<svg class="icon" width="${size}" height="${size}"
    viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
    aria-hidden="true">${content}</svg>`;
}

document.getElementById("brandIcon").innerHTML = icon("wallet", 24);

/* =========================================================
   2. ORIGINAL REGISTER DATA
   Existing records are retained. Unclear amounts and notes
   are intentionally not guessed or automatically corrected.
========================================================= */

const P = (d, a, t = "", n = "") => ({
  d, a, t, n, ok: false
});

const SEED = [
  {n:"Kadlubhai (5 students: Ranveer, Raghav, Tulsi, Aayush, Ishaan)",c:"",f:"",note:"10 baaki",p:[P("10-06-2026","1,44T")]},
  {n:"Dev",c:"GM+07",f:"",p:[P("11-06-2026","20,000")]},
  {n:"Mitesh",c:"GM+09",f:"40 F",p:[P("29-09-2026","4,000")]},
  {n:"Ansh",c:"EM+07",f:"",p:[P("11-06-2026","15000")]},
  {n:"Jensi",c:"EM+07",f:"",note:"15000 - ?",p:[P("23-06-2026","15000")]},
  {n:"Naksh",c:"EM+09",f:"46.5 F",p:[P("30-06-2026","23500")]},
  {n:"Chandrika + Vihan",c:"",f:"57 F",p:[P("11-09-2026","10,000","I")]},
  {n:"Mann + Sister",c:"EM07 + EM11",f:"",p:[P("17-08-2026","10,000","I","2T x5 = 10 jama"),P("29-09-2026","5000","II","10+5 = 15 jama")]},
  {n:"Tanvi",c:"EM+11",f:"",p:[P("20-06-2026","10,000"),P("01-08-2026","10,000")]},
  {n:"Sahdev",c:"GM+11",f:"",p:[P("09-07-2026","25000","I")]},
  {n:"Bharna",c:"GM+11",f:"",p:[P("04-04-2026","10000","I")]},
  {n:"Jigyasha",c:"EM+12",f:"56.5 F",p:[P("10-04-2026","10,000","I"),P("18-07-2026","10,000"),P("15-09-2026","10,000"),P("16-10-2026","15000")]},
  {n:"Priyanshi + Mayank",c:"EM+12",f:"56.5 F / 32.5 F",p:[P("","19000"),P("18-07-2026","10000"),P("03-08-2026","10000"),P("05-09-2026","10000")]},
  {n:"Dhruvi",c:"GM+12",f:"",p:[P("09-06-2026","12000"),P("05-10-2026","18000")]},
  {n:"Zeel",c:"GM+12",f:"42.5 F ?",p:[P("18-05-2026","10000")]},
  {n:"Shraddha",c:"GM+12",f:"36.5 F",p:[P("29-05-2026","15000")]},
  {n:"Suhani",c:"GM+12",f:"43.5 F",p:[P("","10,000","I"),P("","10,000","II")]},
  {n:"Vishwa",c:"EM+10",f:"56.5 F",p:[P("06-04-2026","28500","I"),P("07-07-2026","28000","II")]},
  {n:"Saurav",c:"EM+10",f:"56.5 F",p:[P("12-04-2026","11500","I"),P("11-07-2026","15000","II")]},
  {n:"Vedant",c:"GM+10",f:"",p:[P("19-07-2026","15000")]},
  {n:"Hardik",c:"GM+10",f:"",p:[P("05-07-2026","25000")]},
  {n:"Dhruvil",c:"GM+10",f:"45 F",p:[P("","10000")]},
  {n:"Shaurya",c:"GM+10",f:"56.5 F",p:[P("28-04-2026","28500"),P("01-07-2026","20000"),P("01-08-2026","20500")]},
  {n:"Maanush",c:"GM+10",f:"30 F",p:[P("04-06-2026","10000"),P("10-07-2026","7000"),P("20-08-2026","10000"),P("08-10-2026","8000")]},
  {n:"Priyansh",c:"GM+10",f:"56 F",p:[P("","7000"),P("16-06-2026","5000"),P("19-09-2026","10000")]},
  {n:"Tejas",c:"GM+10",f:"56.5 F",p:[P("","21000"),P("27-08-2026","35000")]},
  {n:"Honey",c:"GM+10",f:"",note:"Fee total nakki karvi",p:[P("15-05-2026","15000")]},
  {n:"Divyanshi",c:"GM+10",f:"",p:[P("","15000"),P("09-07-2026","5000"),P("07-08-2026","7000"),P("06-10-2026","5000")]}
];

/* =========================================================
   3. STORAGE AND APPLICATION STATE
========================================================= */

const KEY = "feeRegister_professional_v2";
const OLDKEY = "feeRegister_v1";

let D;
let view = "list";
let selected = null;
let query = "";
let course = "All";
let filter = "All";
let sort = "name";
let toastTimer;

const clone = value => JSON.parse(JSON.stringify(value));

function normalizeData(records) {
  if (!Array.isArray(records)) throw new Error("Invalid register data");

  return records.map((student, index) => {
    if (!student || typeof student.n !== "string" ||
        !Array.isArray(student.p)) {
      throw new Error("Invalid student record");
    }

    return {
      ...student,
      no: student.no || index + 1,
      c: student.c || "",
      f: student.f || "",
      note: student.note || "",
      feeTotal: student.feeTotal ?? "",
      p: student.p.map(payment => ({
        d: payment.d || "",
        a: payment.a ?? "",
        t: payment.t || "",
        n: payment.n || "",
        ok: Boolean(payment.ok)
      }))
    };
  });
}

function loadData() {
  try {
    const current = localStorage.getItem(KEY);
    if (current) return normalizeData(JSON.parse(current));

    const old = localStorage.getItem(OLDKEY);
    if (old) return normalizeData(JSON.parse(old));

    return normalizeData(clone(SEED));
  } catch (error) {
    console.error("Register loading error:", error);
    notify("Stored data could not be loaded. Original records displayed.");
    return normalizeData(clone(SEED));
  }
}

D = loadData();

function save() {
  try {
    const serialized = JSON.stringify(D);
    localStorage.setItem(KEY, serialized);
    localStorage.setItem(OLDKEY, serialized);
    return true;
  } catch (error) {
    console.error("Register saving error:", error);
    notify("Could not save. Export a backup and check browser storage.");
    return false;
  }
}

/* =========================================================
   4. GENERAL HELPERS
========================================================= */

const esc = value => String(value ?? "").replace(/[&<>"']/g, char => ({
  "&": "&amp;",
  "<": "&lt;",
  ">": "&gt;",
  '"': "&quot;",
  "'": "&#39;"
}[char]));

function amount(value) {
  const cleaned = String(value ?? "").replace(/[₹,\s]/g, "");
  return /^\d+(\.\d{1,2})?$/.test(cleaned)
    ? Number(cleaned)
    : null;
}

function fmt(value) {
  return Number(value || 0).toLocaleString("en-IN", {
    maximumFractionDigits: 2
  });
}

function sum(student) {
  return student.p.reduce((total, payment) => {
    return total + (amount(payment.a) ?? 0);
  }, 0);
}

function allReceived() {
  return D.reduce((total, student) => total + sum(student), 0);
}

function paidCount() {
  return D.reduce((total, student) => {
    return total + student.p.filter(payment => payment.ok).length;
  }, 0);
}

function balance(student) {
  const total = amount(student.feeTotal);
  return total === null ? null : total - sum(student);
}

function validCount(student) {
  return student.p.filter(payment => amount(payment.a) !== null).length;
}

function status(student) {
  const remaining = balance(student);

  if (remaining === null) {
    return {text:"Fee total not set", cls:"neutral", icon:"alert"};
  }

  if (remaining < 0) {
    return {text:"Overpaid / check", cls:"red", icon:"alert"};
  }

  if (remaining === 0) {
    return {text:"Settled", cls:"green", icon:"check"};
  }

  return {text:"Balance ₹" + fmt(remaining), cls:"amber", icon:"money"};
}

function notify(message) {
  const element = document.getElementById("toast");
  element.textContent = message;
  element.classList.remove("hidden");

  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    element.classList.add("hidden");
  }, 3000);
}

function dateToday() {
  const now = new Date();
  const day = String(now.getDate()).padStart(2, "0");
  const month = String(now.getMonth() + 1).padStart(2, "0");
  return `${day}-${month}-${now.getFullYear()}`;
}

function csvCell(value) {
  return '"' + String(value ?? "").replace(/"/g, '""') + '"';
}

function getRows() {
  let rows = D.map((student, index) => ({student, index}));

  rows = rows.filter(({student}) => {
    const matchesCourse = course === "All" || student.c === course;
    const searchable = [
      student.n, student.c, student.f, student.note
    ].join(" ").toLowerCase();

    return matchesCourse && searchable.includes(query.toLowerCase());
  });

  if (filter === "needs-total") {
    rows = rows.filter(({student}) => amount(student.feeTotal) === null);
  }

  if (filter === "unverified") {
    rows = rows.filter(({student}) =>
      student.p.some(payment => !payment.ok)
    );
  }

  if (filter === "unknown-amount") {
    rows = rows.filter(({student}) =>
      student.p.some(payment => amount(payment.a) === null)
    );
  }

  rows.sort((a, b) => {
    if (sort === "received") return sum(b.student) - sum(a.student);
    if (sort === "course") return a.student.c.localeCompare(b.student.c);
    return a.student.n.localeCompare(b.student.n);
  });

  return rows;
}

  if (view === "detail") {
    renderDetail(app);

  renderList(app);

/* =========================================================
   9. ADD / EDIT STUDENT
========================================================= */

function openStudentForm(index = null) {
  const isNew = index === null;

  const student = isNew
    ? {n:"",c:"",f:"",note:"",feeTotal:"",p:[],no:0}
    : D[index];

  if (!student) {
    notify("Account not found.");
    return;
  }

  const s = clone(student);

  openModal(
    isNew ? "Add student / account" : "Edit student / account",
    "Enter clear account information. Unknown fee totals can remain blank.",
    `
      <div class="form-grid">
        ${field("Student / account name","n",s.n,"Full name or group name","text",true)}
        ${field("Course / batch","c",s.c,"e.g. GM+10")}
        ${field("Reference details","f",s.f,"Existing shorthand / reference")}
        ${field("Total course fee (₹)","feeTotal",s.feeTotal,"Leave blank if unknown","number")}

        <div class="field full">
          <label for="field-note">Account note</label>
          <textarea id="field-note" name="note" rows="3"
            placeholder="Follow-up or context">${esc(s.note||"")}</textarea>
        </div>
      </div>

      <div class="notice">
        Total fee is optional. Do not estimate or infer an unknown fee.
      </div>
    `,
    form => {
      const name = String(form.get("n") || "").trim();
      const fee = String(form.get("feeTotal") || "").trim();

      if (!name) {
        notify("Enter a student or account name.");
        return;
      }

      if (fee !== "" && amount(fee) === null) {
        notify("Enter a valid non-negative total fee.");
        return;
      }

      const record = {
        ...s,
        n: name,
        c: String(form.get("c")||"").trim(),
        f: String(form.get("f")||"").trim(),
        note: String(form.get("note")||"").trim(),
        feeTotal: fee,
        p: s.p || [],
        no: s.no || (D.length ? Math.max(...D.map(x=>x.no||0))+1 : 1)
      };

      const previous = D[index];

      if (isNew) D.push(record);
      else D[index] = record;

      if (!save()) {
        if (isNew) D.pop();
        else D[index] = previous;
        return;
      }

      closeModal();
      if (isNew) {
        view = "list";
        selected = null;
      } else if (view === "detail") {
        selected = index;
      }

      render();
      notify(isNew ? "Account added." : "Account updated.");
    }
  );
}

/* =========================================================
   10. ADD / EDIT PAYMENT
========================================================= */

function openPaymentForm(paymentIndex = null) {
  if (selected === null || !D[selected]) {
    notify("Select an account first.");
    return;
  }

  const isNew = paymentIndex === null;

  const payment = isNew
    ? {d:dateToday(),a:"",t:"",n:"",ok:false}
    : D[selected].p[paymentIndex];

  if (!payment) {
    notify("Payment entry not found.");
    return;
  }

  const p = clone(payment);

  openModal(
    isNew ? "Add payment" : "Edit payment",
    "Use the correct date, amount and installment reference.",
    `
      <div class="form-grid">
        ${field("Payment date (DD-MM-YYYY)","d",p.d,"e.g. 28-10-2026")}
        ${field("Amount (₹)","a",p.a,"Numbers only","text",true)}
        ${field("Installment / reference","t",p.t,"e.g. I, II, 1st")}
        ${field("Payment note","n",p.n,"Optional details")}

        <div class="field full">
          <label>
            <input type="checkbox" name="ok" ${p.ok?"checked":""}>
            Mark payment as verified
          </label>
        </div>
      </div>

      <div class="notice">
        Enter an amount such as 15000 without commas or currency symbols.
        Check historical entries against the original record before correcting.
      </div>
    `,
    form => {
      const rawAmount = String(form.get("a")||"").trim();

      if (amount(rawAmount) === null) {
        notify("Enter a valid numeric payment amount.");
        return;
      }

      const record = {
        d: String(form.get("d")||"").trim(),
        a: rawAmount,
        t: String(form.get("t")||"").trim(),
        n: String(form.get("n")||"").trim(),
        ok: form.get("ok") === "on"
      };

      const original = D[selected].p[paymentIndex];

      if (isNew) D[selected].p.push(record);
      else D[selected].p[paymentIndex] = record;

      if (!save()) {
        if (isNew) D[selected].p.pop();
        else D[selected].p[paymentIndex] = original;
        return;
      }

      closeModal();
      render();
      notify(isNew ? "Payment added." : "Payment updated.");
    }
  );
}

/* =========================================================
   11. DELETE OPERATIONS
========================================================= */

function deletePayment(index) {
  const payment = D[selected]?.p[index];
  if (!payment) return;

  if (!confirm("Delete this payment permanently?")) return;

  const removed = D[selected].p.splice(index, 1)[0];

  if (!save()) {
    D[selected].p.splice(index, 0, removed);
    return;
  }

  render();
  notify("Payment deleted.");
}

function deleteStudent(index) {
  const student = D[index];
  if (!student) return;

  const confirmed = confirm(
    "Delete this account and all its payments permanently?\n\n" +
    "Export a backup first if you may need this information."
  );

  if (!confirmed) return;

  const removed = D.splice(index, 1)[0];

  if (!save()) {
    D.splice(index, 0, removed);
    return;
  }

  view = "list";
  selected = null;
  render();
  notify("Account deleted.");
}

/* =========================================================
   12. BACKUP AND IMPORT
========================================================= */

function download(filename, content, type) {
  const blob = new Blob([content], {type});
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");

  link.href = url;
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  link.remove();

  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function backupJSON() {
  const backup = {
    format: "fee-register-backup-v2",
    exportedAt: new Date().toISOString(),
    students: D
  };

  download(
    "fee-register-backup-" + new Date().toISOString().slice(0,10) + ".json",
    JSON.stringify(backup, null, 2),
    "application/json"
  );

  notify("JSON backup exported.");
}

document.getElementById("importFile").addEventListener("change", event => {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();

  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      const records = Array.isArray(parsed) ? parsed : parsed.students;
      const imported = normalizeData(records);

      if (!confirm(
        "Replace the current register with " + imported.length +
        " imported accounts?\n\nExport a backup of the current register first."
      )) return;

      const previous = D;
      D = imported;

      if (!save()) {
        D = previous;
        return;
      }

      view = "list";
      selected = null;
      query = "";
      course = "All";
      filter = "All";
      render();
      notify("Backup imported successfully.");
    } catch (error) {
      console.error("Import error:", error);
      alert("Invalid backup file. The current register has not been replaced.");
    } finally {
      event.target.value = "";
    }
  };

  reader.onerror = () => {
    alert("Could not read this file.");
    event.target.value = "";
  };

  reader.readAsText(file);
});

/* =========================================================
   13. CSV EXPORT
========================================================= */

function exportCSV(selectedStudents = D) {
  const rows = [[
    "No", "Student / account", "Course", "Reference details",
    "Total course fee", "Date", "Amount (raw)", "Installment",
    "Payment note", "Verified", "Amount valid", "Balance"
  ]];

  selectedStudents.forEach(student => {
    if (student.p.length) {
      student.p.forEach(payment => {
        rows.push([
          student.no,
          student.n,
          student.c,
          student.f,
          student.feeTotal,
          payment.d,
          payment.a,
          payment.t,
          payment.n,
          payment.ok ? "Yes" : "No",
          amount(payment.a) !== null ? "Yes" : "Review",
          balance(student) ?? ""
        ]);
      });
    } else {
      rows.push([
        student.no, student.n, student.c, student.f,
        student.feeTotal, "", "", "", "", "", "", ""
      ]);
    }
  });

  const csv = rows.map(row => row.map(csvCell).join(",")).join("\r\n");

  download(
    "fee-register-" + new Date().toISOString().slice(0,10) + ".csv",
    "\ufeff" + csv,
    "text/csv;charset=utf-8"
  );

  notify("CSV exported.");
}

/* =========================================================
   14. INITIALIZE APPLICATION
========================================================= */

render();
</script>
