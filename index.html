<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fee Register | Student Accounts</title>
<style>
:root{--bg:#f3f5f8;--paper:#fff;--ink:#202b3c;--muted:#68758a;--line:#e1e6ed;--navy:#213b5b;--navy2:#304f73;--accent:#a66b79;--accent-bg:#f7edf0;--green:#287653;--green-bg:#eaf5ef;--amber:#94651b;--amber-bg:#fff5df;--red:#a33e45;--red-bg:#fff0f0;--shadow:0 8px 24px #1d31450a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:white;color:var(--ink);border-radius:9px;padding:9px 12px;font-weight:600}button:hover{border-color:#9caabd}button.primary{background:var(--navy);color:white;border-color:var(--navy)}button.soft{background:var(--accent-bg);border-color:#ead7dc;color:#814e5b}button.danger{color:var(--red)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #8ba8d666;outline-offset:1px}
.shell{max-width:1250px;margin:auto;padding:26px 22px 44px}.masthead{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:22px}.eyebrow{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.brand{display:flex;align-items:center;gap:12px}.monogram{width:43px;height:43px;border-radius:13px;background:var(--navy);color:white;display:grid;place-items:center;font-family:Georgia,serif;font-size:24px}.brand h1{font:500 29px/1.15 Georgia,"Times New Roman",serif;letter-spacing:-.03em;margin:4px 0}.subtitle{color:var(--muted);margin:5px 0 0}.top-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin:20px 0}.stat{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:17px 18px;box-shadow:var(--shadow)}.stat .label{color:var(--muted);font-size:12px;font-weight:650}.stat .value{font-size:25px;font-weight:750;letter-spacing:-.04em;margin-top:5px}.stat .hint{font-size:11px;color:var(--muted);margin-top:3px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);overflow:hidden}.toolbar{padding:16px;display:flex;gap:9px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}input,select,textarea{border:1px solid #d7dee8;background:#fff;color:var(--ink);border-radius:9px;padding:9px 11px;min-width:0}input::placeholder,textarea::placeholder{color:#98a2b1}#search{flex:1;min-width:200px}.filters{display:flex;gap:7px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}.filter{border-radius:999px;padding:6px 12px;font-size:12px}.filter.active{background:var(--navy);color:white;border-color:var(--navy)}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th{text-align:left;background:#f8fafc;color:#68758a;font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:12px 15px;white-space:nowrap}td{padding:13px 15px;border-top:1px solid #edf0f4;vertical-align:middle}tbody tr:hover{background:#fbfcfe}.student{font-weight:750;color:var(--navy);cursor:pointer}.student:hover{text-decoration:underline}.subline{font-size:11px;color:var(--muted);margin-top:3px}.course{display:inline-block;border:1px solid #dce3ed;background:#f5f7fa;padding:3px 8px;border-radius:6px;font-size:11px;white-space:nowrap}.money{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:750;white-space:nowrap}.badge.green{color:var(--green);background:var(--green-bg)}.badge.amber{color:var(--amber);background:var(--amber-bg)}.badge.red{color:var(--red);background:var(--red-bg)}.badge.neutral{color:#5d6878;background:#eef1f5}.row-actions{display:flex;gap:5px}.icon-btn{padding:6px 8px;font-size:12px}.empty{padding:45px 20px;text-align:center;color:var(--muted)}.footer{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:11px;padding:15px 3px}.view{padding:20px}.view-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;flex-wrap:wrap}.view h2{font:500 25px Georgia,serif;margin:0 0 6px}.detail-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:18px 0}.mini{border:1px solid var(--line);border-radius:11px;padding:13px}.mini label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}.section-title{font-weight:750;margin:23px 0 9px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:12px;font-weight:700;color:#526075}.field input,.field select,.field textarea{width:100%}.field.full{grid-column:1/-1}.modal-backdrop{position:fixed;inset:0;background:#17233470;display:grid;place-items:center;padding:16px;z-index:5}.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:white;border-radius:16px;padding:22px;box-shadow:0 20px 80px #0003}.modal h3{font:500 24px Georgia,serif;margin:0 0 18px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.notice{padding:11px 13px;background:#f7f9fc;border:1px solid var(--line);border-radius:10px;color:var(--muted);font-size:12px;margin:12px 0}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#202b3c;color:white;padding:11px 16px;border-radius:10px;box-shadow:var(--shadow);z-index:10}.hidden{display:none!important}.small{font-size:12px;color:var(--muted)}.payment-list{display:grid;gap:8px}.payment{display:grid;grid-template-columns:22px 1fr auto auto;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:10px}.payment input{width:17px;height:17px;accent-color:var(--green)}.payment-note{font-size:12px;color:var(--muted)}.warning{color:var(--amber)}
@media(max-width:760px){.shell{padding:18px 12px 30px}.masthead{flex-direction:column}.top-actions{justify-content:flex-start}.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.stat{padding:13px}.stat .value{font-size:21px}.detail-grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.payment{grid-template-columns:22px 1fr auto}.payment .payment-actions{grid-column:2/-1}.brand h1{font-size:26px}}

/* Tablet and mobile layout: dropdown filters and roomy account cards */
.mobile-filters{display:none}
.mobile-account-list{display:none}
.account-card{background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:16px;display:grid;gap:13px;min-width:0}
.account-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;min-width:0}
.account-card-name{font-weight:800;color:var(--navy);font-size:16px;line-height:1.35;overflow-wrap:anywhere;cursor:pointer}
.account-card-meta{color:var(--muted);font-size:12px;line-height:1.5;overflow-wrap:anywhere;margin-top:5px}
.account-card-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.account-card-stat{padding:11px;background:#f8fafc;border:1px solid #edf0f4;border-radius:10px;min-width:0}
.account-card-stat span{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}
.account-card-stat strong{display:block;font-size:14px;overflow-wrap:anywhere}
.account-card-actions{display:flex;gap:8px;flex-wrap:wrap}
.account-card-actions button{flex:1 1 100px}
.mobile-filters select{width:100%;min-height:44px;background:#fff}
@media(max-width:900px){
  .shell{padding:20px 16px 32px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .desktop-filters{display:none!important}
  .mobile-filters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
  .mobile-filter-field{display:grid;gap:6px;min-width:0}
  .mobile-filter-field label{font-size:11px;font-weight:750;color:var(--muted)}
  .mobile-account-list{display:grid;gap:12px;padding:14px}
  .table-wrap{display:none}
  .toolbar{align-items:stretch}
  #search{flex:1 1 100%;min-width:0;width:100%}
  .toolbar select{flex:1 1 180px;min-height:42px}
  .toolbar button{flex:1 1 auto}
  .view{padding:18px}
  .detail-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .detail-grid .mini:last-child{grid-column:1/-1}
  .payment{grid-template-columns:22px minmax(0,1fr);gap:10px;padding:14px}
  .payment>div:nth-child(2){min-width:0;overflow-wrap:anywhere}
  .payment>.badge{grid-column:2;justify-self:start}
  .payment .payment-actions{grid-column:2;flex-wrap:wrap}
}
@media(max-width:600px){
  .shell{padding:14px 10px 24px}
  .masthead{gap:14px;margin-bottom:16px}
  .brand{align-items:flex-start;gap:10px}
  .monogram{width:39px;height:39px;flex:0 0 39px;font-size:22px}
  .brand h1{font-size:25px}
  .subtitle{font-size:12px;max-width:34ch}
  .top-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));width:100%;gap:8px}
  .top-actions button{width:100%;min-height:43px;padding:9px 8px;font-size:12px}
  .top-actions button.primary{grid-column:1/-1}
  .stats{gap:8px;margin:14px 0}
  .stat{padding:12px;border-radius:12px;min-width:0}
  .stat .label{font-size:11px;line-height:1.35}
  .stat .value{font-size:19px;overflow-wrap:anywhere;letter-spacing:-.03em}
  .stat .hint{font-size:10px;line-height:1.4}
  .toolbar{padding:12px;gap:8px}
  .mobile-filters{grid-template-columns:minmax(0,1fr);padding:12px;gap:11px}
  .mobile-account-list{padding:10px;gap:10px}
  .account-card{padding:13px;gap:12px}
  .account-card-head{display:block}
  .account-card-head>.badge{margin-top:9px;white-space:normal}
  .account-card-stats{gap:8px}
  .account-card-stat{padding:10px}
  .account-card-stat strong{font-size:13px}
  .account-card-actions button{min-height:42px}
  .view{padding:14px}
  .view h2{font-size:22px;overflow-wrap:anywhere}
  .view-head{gap:14px}
  .detail-actions{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr));width:100%}
  .detail-actions button{min-height:43px;padding:9px 8px}
  .detail-actions button:last-child{grid-column:1/-1}
  .detail-grid{grid-template-columns:minmax(0,1fr);gap:9px;margin:14px 0}
  .detail-grid .mini:last-child{grid-column:auto}
  .mini{padding:13px}
  .section-title{margin-top:20px;line-height:1.45}
  .section-title .small{display:block;margin-top:4px}
  .payment{grid-template-columns:20px minmax(0,1fr);padding:12px;gap:9px}
  .payment strong{font-size:13px;line-height:1.45;overflow-wrap:anywhere}
  .payment-note{line-height:1.5;overflow-wrap:anywhere}
  .modal-backdrop{padding:8px;align-items:end}
  .modal{width:100%;max-height:92dvh;border-radius:16px 16px 10px 10px;padding:17px}
  .modal h3{font-size:22px}
  .form-grid{grid-template-columns:minmax(0,1fr);gap:12px}
  .field.full{grid-column:auto}
  .field input,.field textarea,.field select{min-height:44px;font-size:16px}
  .modal-actions{position:sticky;bottom:-17px;background:#fff;padding:12px 0 2px;justify-content:stretch}
  .modal-actions button{flex:1;min-height:44px}
  .footer{font-size:10px;line-height:1.5;padding:13px 2px}
  .toast{width:calc(100% - 24px);text-align:center;bottom:12px}
}
@media(max-width:360px){
  .stats{grid-template-columns:minmax(0,1fr)}
  .top-actions{grid-template-columns:minmax(0,1fr)}
  .top-actions button.primary{grid-column:auto}
  .account-card-stats{grid-template-columns:minmax(0,1fr)}
}
@media print{body{background:white}.shell{max-width:none;padding:0}.top-actions,.toolbar button,.filters,.row-actions,.footer .private,.detail-actions{display:none!important}.panel,.stat{box-shadow:none}.stats{break-inside:avoid}table{min-width:0}th,td{padding:7px;font-size:10px}.masthead{margin-bottom:10px}}
</style></head>
<body><main class="shell">
<header class="masthead"><div class="brand"><div class="monogram">F</div><div><div class="eyebrow">Student accounts · Private register</div><h1>Fee Register</h1><p class="subtitle">A clear record of payments, installments and follow-ups.</p></div></div>
<div class="top-actions"><button onclick="backupJSON()">Export backup</button><button onclick="document.getElementById('importFile').click()">Import backup</button><input id="importFile" type="file" accept=".json,application/json" hidden onchange="importJSON(event)"><button onclick="exportCSV()">Export CSV</button><button onclick="window.print()">Print</button><button class="primary" onclick="openStudentForm()">+ Add student</button></div></header>
<section class="stats" id="stats"></section><section class="panel" id="app"></section>
<div class="footer"><span>Autosaves in this browser · Export regular backups to avoid data loss.</span><span class="private">Amounts are calculated from numeric payment entries only. No fee balance is assumed unless a total fee is entered.</span></div>
</main><div id="modalRoot"></div><div id="toast" class="toast hidden"></div>
<script>
const P=(d,a,t,n)=>({d,a,t:t||"",n:n||"",ok:false});
const SEED=[
{n:"Kadlubhai (5 students: Ranveer, Raghav, Tulsi, Aayush, Ishaan)",c:"",f:"",note:"10 baaki",p:[P("10-06-2026","1,44T")]},
{n:"Dev",c:"GM+07",f:"",p:[P("11-06-2026","20,000")]},
{n:"Mitesh",c:"GM+09",f:"40 F",p:[P("29-09-2026","4,000")]},
{n:"Ansh",c:"EM+07",f:"",p:[P("11-06-2026","15000")]},
{n:"Jensi",c:"EM+07",f:"",note:"15000 - ?",p:[P("23-06-2026","15000")]},
{n:"Naksh",c:"EM+09",f:"46.5 F",p:[P("30-06-2026","23500")]},
{n:"Chandrika + Vihan",c:"",f:"57 F",p:[P("11-09-2026","10,000","I")]},
{n:"Mann + Sister",c:"EM07 + EM11",f:"",p:[P("17-08-2026","10,000","I","2T x5 = 10 jama"),P("29-09-2026","5000","II","10+5 = 15 jama")]},
{n:"Tanvi",c:"EM+11",f:"",p:[P("20-06-2026","10,000"),P("01-08-2026","10,000")]},
{n:"Sahdev",c:"GM+11",f:"",p:[P("09-07-2026","25000","I")]},
{n:"Bharna",c:"GM+11",f:"",p:[P("04-04-2026","10000","I")]},
{n:"Jigyasha",c:"EM+12",f:"56.5 F",p:[P("10-04-2026","10,000","I"),P("18-07-2026","10,000"),P("15-09-2026","10,000"),P("16-10-2026","15000")]},
{n:"Priyanshi + Mayank",c:"EM+12",f:"56.5 F / 32.5 F",p:[P("","19000"),P("18-07-2026","10000"),P("03-08-2026","10000"),P("05-09-2026","10000")]},
{n:"Dhruvi",c:"GM+12",f:"",p:[P("09-06-2026","12000"),P("05-10-2026","18000")]},
{n:"Zeel",c:"GM+12",f:"42.5 F ?",p:[P("18-05-2026","10000")]},
{n:"Shraddha",c:"GM+12",f:"36.5 F",p:[P("29-05-2026","15000")]},
{n:"Suhani",c:"GM+12",f:"43.5 F",p:[P("","10,000","I"),P("","10,000","II")]},
{n:"Vishwa",c:"EM+10",f:"56.5 F",p:[P("06-04-2026","28500","I"),P("07-07-2026","28000","II")]},
{n:"Saurav",c:"EM+10",f:"56.5 F",p:[P("12-04-2026","11500","I"),P("11-07-2026","15000","II")]},
{n:"Vedant",c:"GM+10",f:"",p:[P("19-07-2026","15000")]},
{n:"Hardik",c:"GM+10",f:"",p:[P("05-07-2026","25000")]},
{n:"Dhruvil",c:"GM+10",f:"45 F",p:[P("","10000")]},
{n:"Shaurya",c:"GM+10",f:"56.5 F",p:[P("28-04-2026","28500"),P("01-07-2026","20000"),P("01-08-2026","20500")]},
{n:"Maanush",c:"GM+10",f:"30 F",p:[P("04-06-2026","10000"),P("10-07-2026","7000"),P("20-08-2026","10000"),P("08-10-2026","8000")]},
{n:"Priyansh",c:"GM+10",f:"56 F",p:[P("","7000"),P("16-06-2026","5000"),P("19-09-2026","10000")]},
{n:"Tejas",c:"GM+10",f:"56.5 F",p:[P("","21000"),P("27-08-2026","35000")]},
{n:"Honey",c:"GM+10",f:"",note:"Fee total nakki karvi",p:[P("15-05-2026","15000")]},
{n:"Divyanshi",c:"GM+10",f:"",p:[P("","15000"),P("09-07-2026","5000"),P("07-08-2026","7000"),P("06-10-2026","5000")]}
];
const KEY="feeRegister_professional_v2",OLDKEY="feeRegister_v1";
let D,view="list",selected=null,query="",course="All",filter="All",sort="name",toastTimer;
const clone=x=>JSON.parse(JSON.stringify(x));
try{D=JSON.parse(localStorage.getItem(KEY)||"null");if(!D){const old=JSON.parse(localStorage.getItem(OLDKEY)||"null");D=old||clone(SEED)}}catch(e){D=clone(SEED)}
D=D.map((s,i)=>({...s,no:s.no||i+1,feeTotal:s.feeTotal??"",p:Array.isArray(s.p)?s.p:[]}));
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(D));localStorage.setItem(OLDKEY,JSON.stringify(D));}catch(e){notify("Browser storage is full. Export a backup.");}};
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const amount=x=>{let s=String(x??"").replace(/(?:Rs\.?|₹|,|\s)/gi,"");return /^\d+(\.\d{1,2})?$/.test(s)?Number(s):null};
const fmt=n=>Number(n||0).toLocaleString("en-IN",{maximumFractionDigits:2});
const sum=s=>s.p.reduce((a,p)=>a+(amount(p.a)??0),0);
const validCount=s=>s.p.filter(p=>amount(p.a)!==null).length;
const allReceived=()=>D.reduce((a,s)=>a+sum(s),0);
const paidCount=()=>D.reduce((a,s)=>a+s.p.filter(p=>p.ok).length,0);
const balance=s=>amount(s.feeTotal)===null?null:amount(s.feeTotal)-sum(s);
function notify(t){const e=document.getElementById("toast");e.textContent=t;e.classList.remove("hidden");clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.add("hidden"),2600)}
function status(s){const b=balance(s);if(b===null)return {text:"Fee total not set",cls:"neutral"};if(b<0)return{text:"Overpaid / check",cls:"red"};if(b===0)return{text:"Settled",cls:"green"};return{text:"Balance Rs. "+fmt(b),cls:"amber"}}
function renderStats(){let unknown=D.filter(s=>amount(s.feeTotal)===null).length;document.getElementById("stats").innerHTML=`
<div class="stat"><div class="label">Students / accounts</div><div class="value">${D.length}</div><div class="hint">Including grouped accounts as originally entered</div></div>
<div class="stat"><div class="label">Recorded payments</div><div class="value">Rs. ${fmt(allReceived())}</div><div class="hint">Valid numeric amounts only</div></div>
<div class="stat"><div class="label">Payments verified</div><div class="value">${paidCount()}</div><div class="hint">Tick payment after checking the record</div></div>
<div class="stat"><div class="label">Fee totals missing</div><div class="value">${unknown}</div><div class="hint">Enter each total to calculate balance</div></div>`}
function render(){renderStats();const app=document.getElementById("app");if(view==="detail"){renderDetail(app);return}
const courses=["All",...new Set(D.map(s=>s.c).filter(Boolean).sort())];
let rows=D.map((s,i)=>({s,i})).filter(({s})=>(course==="All"||s.c===course)&&(`${s.n} ${s.c} ${s.f} ${s.note||""}`).toLowerCase().includes(query.toLowerCase()));
if(filter==="needs-total")rows=rows.filter(({s})=>amount(s.feeTotal)===null);
if(filter==="unverified")rows=rows.filter(({s})=>s.p.some(p=>!p.ok));
if(filter==="unknown-amount")rows=rows.filter(({s})=>s.p.some(p=>amount(p.a)===null));
rows.sort((a,b)=>sort==="received"?sum(b.s)-sum(a.s):sort==="course"?a.s.c.localeCompare(b.s.c):a.s.n.localeCompare(b.s.n));
app.innerHTML=`<div class="toolbar"><input id="search" placeholder="Search student, course or note…" value="${esc(query)}" oninput="query=this.value;renderListOnly()"><select aria-label="Sort students" onchange="sort=this.value;render()"><option value="name" ${sort==="name"?"selected":""}>Sort: name</option><option value="received" ${sort==="received"?"selected":""}>Sort: amount received</option><option value="course" ${sort==="course"?"selected":""}>Sort: course</option></select><button onclick="exportCSV()">Export filtered data</button></div>
<div class="filters desktop-filters">${courses.map(c=>`<button class="filter ${course===c?"active":""}" onclick="course=${JSON.stringify(c)};render()">${esc(c)}</button>`).join("")}</div>
<div class="filters desktop-filters">${[["All","All records"],["needs-total","Fee total missing"],["unverified","Unverified payments"],["unknown-amount","Check amount"]].map(([v,l])=>`<button class="filter ${filter===v?"active":""}" onclick="filter=${JSON.stringify(v)};render()">${l}</button>`).join("")}<span class="small" style="margin:auto 0 auto auto">${rows.length} account(s)</span></div>
<div class="mobile-filters"><div class="mobile-filter-field"><label for="courseFilter">Course / batch</label><select id="courseFilter" aria-label="Filter by course" onchange="course=this.value;render()">${courses.map(c=>`<option value="${esc(c)}" ${course===c?"selected":""}>${esc(c==="All"?"All courses":c)}</option>`).join("")}</select></div><div class="mobile-filter-field"><label for="recordFilter">Record status</label><select id="recordFilter" aria-label="Filter records" onchange="filter=this.value;render()">${[["All","All records"],["needs-total","Fee total missing"],["unverified","Unverified payments"],["unknown-amount","Check amount"]].map(([v,l])=>`<option value="${v}" ${filter===v?"selected":""}>${l}</option>`).join("")}</select></div><div class="small" style="grid-column:1/-1">${rows.length} account(s) match your filters</div></div>
<div class="mobile-account-list">${rows.length?rows.map(({s,i})=>`<article class="account-card"><div class="account-card-head"><div><div class="account-card-name" onclick="openDetail(${i})">${esc(s.n)}</div><div class="account-card-meta">${s.c?`Course: ${esc(s.c)}`:"Course not recorded"}${s.f?` · ${esc(s.f)}`:""}${s.note?`<br>${esc(s.note)}`:""}</div></div><span class="badge ${status(s).cls}">${esc(status(s).text)}</span></div><div class="account-card-stats"><div class="account-card-stat"><span>Payments recorded</span><strong>${s.p.length} total · ${s.p.filter(p=>p.ok).length} verified</strong></div><div class="account-card-stat"><span>Total received</span><strong class="money">Rs. ${fmt(sum(s))}</strong>${s.p.some(p=>amount(p.a)===null)?'<div class="subline warning">Amount needs review</div>':""}</div></div><div class="account-card-actions"><button onclick="openDetail(${i})">View details</button><button onclick="openStudentForm(${i})">Edit account</button></div></article>`).join(""):`<div class="empty">No matching accounts. Change the search or filters.</div>`}</div>
<div class="table-wrap"><table><thead><tr><th>Student / account</th><th>Course</th><th>Payments</th><th>Received</th><th>Fee status</th><th>Actions</th></tr></thead><tbody>${rows.length?rows.map(({s,i})=>`<tr><td><div class="student" onclick="openDetail(${i})">${esc(s.n)}</div><div class="subline">${esc(s.f||"")} ${s.note?"· "+esc(s.note):""}</div></td><td>${s.c?`<span class="course">${esc(s.c)}</span>`:"—"}</td><td>${s.p.length}<div class="subline">${s.p.filter(p=>p.ok).length} verified</div></td><td class="money">Rs. ${fmt(sum(s))}${s.p.some(p=>amount(p.a)===null)?'<div class="subline warning">Amount needs review</div>':""}</td><td><span class="badge ${status(s).cls}">${esc(status(s).text)}</span></td><td><div class="row-actions"><button class="icon-btn" onclick="openDetail(${i})">Open</button><button class="icon-btn" onclick="openStudentForm(${i})">Edit</button></div></td></tr>`).join(""):`<tr><td colspan="6"><div class="empty">No matching accounts. Change the search or filters.</div></td></tr>`}</tbody></table></div>`;
}
function renderListOnly(){const e=document.getElementById("search");if(!e)return;const pos=e.selectionStart;query=e.value;render();const n=document.getElementById("search");if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}}
function openDetail(i){selected=i;view="detail";render()}
function renderDetail(app){const s=D[selected];if(!s){view="list";render();return}app.innerHTML=`<div class="view"><div class="view-head"><div><button onclick="view='list';selected=null;render()">← All accounts</button><div class="eyebrow" style="margin-top:16px">Account details</div><h2 style="margin-top:5px">${esc(s.n)}</h2><div class="small">${s.c?esc(s.c)+" · ":""}${esc(s.f||"No extra details recorded")}</div></div><div class="detail-actions" style="display:flex;gap:8px;flex-wrap:wrap"><button onclick="openStudentForm(${selected})">Edit account</button><button class="primary" onclick="openPaymentForm()">+ Add payment</button><button class="danger" onclick="deleteStudent(${selected})">Delete account</button></div></div>
<div class="detail-grid"><div class="mini"><label>Total received</label><strong class="money">Rs. ${fmt(sum(s))}</strong></div><div class="mini"><label>Total course fee</label><strong>${amount(s.feeTotal)===null?"Not entered":"Rs. "+fmt(amount(s.feeTotal))}</strong></div><div class="mini"><label>Balance</label><strong>${balance(s)===null?"Cannot calculate":"Rs. "+fmt(balance(s))}</strong></div></div>
${s.note?`<div class="notice"><strong>Original note:</strong> ${esc(s.note)}</div>`:""}
<div class="section-title">Payment history <span class="small">· Tick “Verified” only after confirming payment</span></div>
${s.p.length?`<div class="payment-list">${s.p.map((p,j)=>`<div class="payment"><input type="checkbox" title="Verified payment" ${p.ok?"checked":""} onchange="D[${selected}].p[${j}].ok=this.checked;save();render()"><div><strong>${esc(p.t||"Payment "+(j+1))} · Rs. ${fmt(amount(p.a)??0)}</strong><div class="payment-note">${esc(p.d||"Date not recorded")}${p.n?" · "+esc(p.n):""}${amount(p.a)===null?' · <span class="warning">Raw amount needs correction</span>':""}</div></div><span class="badge ${p.ok?"green":"amber"}">${p.ok?"Verified":"Unverified"}</span><div class="payment-actions row-actions"><button class="icon-btn" onclick="openPaymentForm(${j})">Edit</button><button class="icon-btn danger" onclick="deletePayment(${j})">Delete</button></div></div>`).join("")}</div>`:`<div class="empty">No payment entries yet.</div>`}
<div class="section-title">Automation and data checks</div><div class="notice">Changes autosave in this browser. Export a JSON backup regularly. Amounts such as “1,44T” are preserved exactly but excluded from totals until corrected. Blank dates and unclear notes remain visible for manual review.</div></div>`}
function openModal(title,body,onSave){document.getElementById("modalRoot").innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><section class="modal"><h3>${title}</h3><form id="editForm">${body}<div class="modal-actions"><button type="button" onclick="closeModal()">Cancel</button><button class="primary" type="submit">Save changes</button></div></form></section></div>`;document.getElementById("editForm").onsubmit=e=>{e.preventDefault();onSave(new FormData(e.target));}}
function closeModal(){document.getElementById("modalRoot").innerHTML=""}
function field(label,name,value="",placeholder="",type="text",required=false){return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${esc(value)}" placeholder="${esc(placeholder)}" ${required?"required":""}></div>`}
function openStudentForm(i=null){const s=i===null?{n:"",c:"",f:"",note:"",feeTotal:""}:D[i];openModal(i===null?"Add student / account":"Edit student / account",`<div class="form-grid">${field("Student / account name","n",s.n,"Full name or group name","text",true)}${field("Course / batch","c",s.c,"e.g. GM+10")}${field("Reference details","f",s.f,"Existing shorthand / note")}${field("Total course fee (Rs.)","feeTotal",s.feeTotal,"Leave blank if unknown","number") }<div class="field full"><label>Account note</label><textarea name="note" rows="2" placeholder="Follow-up or context">${esc(s.note||"")}</textarea></div></div><div class="notice">Existing fee figures are not inferred. Enter a confirmed total fee only if you know it.</div>`,f=>{const n=f.get("n").trim();if(!n)return;const fee=String(f.get("feeTotal")||"").trim();if(fee!==""&&(!Number.isFinite(Number(fee))||Number(fee)<0)){notify("Enter a valid total fee.");return}const obj={n,c:f.get("c").trim(),f:f.get("f").trim(),note:f.get("note").trim(),feeTotal:fee,p:s.p||[],no:s.no||(D.length?Math.max(...D.map(x=>x.no))+1:1)};if(i===null)D.push(obj);else D[i]={...D[i],...obj};save();closeModal();if(i!==null&&view==="detail")selected=i;render();notify("Account saved.");})}
function openPaymentForm(j=null){const s=D[selected],p=j===null?{d:"",a:"",t:"",n:"",ok:false}:s.p[j];openModal(j===null?"Add payment":"Edit payment",`<div class="form-grid">${field("Payment date (DD-MM-YYYY)","d",p.d,"e.g. 28-10-2026")}${field("Amount (Rs. )","a",p.a,"Numbers only","text",true)}${field("Installment / reference","t",p.t,"e.g. I, II, 1st")}${field("Payment note","n",p.n,"Optional detail")}<div class="field full"><label><input name="ok" type="checkbox" ${p.ok?"checked":""} style="width:auto;margin-right:7px">Mark payment as verified</label></div></div><div class="notice">Keep amounts numeric (for example 14400). Unclear historical entries should be checked against the original record before changing.</div>`,f=>{const a=f.get("a").trim();if(amount(a)===null){notify("Enter a numeric amount, without commas or symbols.");return}const obj={d:f.get("d").trim(),a,t:f.get("t").trim(),n:f.get("n").trim(),ok:f.get("ok")==="on"};if(j===null)s.p.push(obj);else s.p[j]=obj;save();closeModal();render();notify("Payment saved.");})}
function deletePayment(j){if(!confirm("Delete this payment entry permanently?"))return;D[selected].p.splice(j,1);save();render();notify("Payment deleted.")}
function deleteStudent(i){if(!confirm("Delete this account and all its payment entries? Export a backup first if unsure."))return;D.splice(i,1);save();view="list";selected=null;render();notify("Account deleted.")}
function download(name,content,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function backupJSON(){download("fee-register-backup-"+new Date().toISOString().slice(0,10)+".json",JSON.stringify({format:"fee-register-backup-v2",exportedAt:new Date().toISOString(),students:D},null,2),"application/json");notify("Backup exported.")}
function importJSON(ev){const file=ev.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const obj=JSON.parse(reader.result),arr=Array.isArray(obj)?obj:obj.students;if(!Array.isArray(arr)||!arr.every(s=>s&&typeof s.n==="string"&&Array.isArray(s.p)))throw Error("format");if(!confirm("Replace the current register with "+arr.length+" imported accounts? Export a backup first."))return;D=arr.map((s,i)=>({...s,no:s.no||i+1,feeTotal:s.feeTotal??"",p:s.p.map(p=>({...p,ok:!!p.ok}))}));save();view="list";selected=null;render();notify("Backup imported.");}catch(e){alert("This file is not a valid Fee Register backup.");}finally{ev.target.value=""}};reader.readAsText(file)}
function exportCSV(){const rows=[["No","Student / account","Course","Reference details","Total course fee","Date","Amount (raw)","Installment","Payment note","Verified","Amount valid","Balance"]];D.forEach(s=>{if(s.p.length)s.p.forEach(p=>rows.push([s.no,s.n,s.c,s.f,s.feeTotal,p.d,p.a,p.t,p.n,p.ok?"Yes":"No",amount(p.a)!==null?"Yes":"Review",balance(s)??""]));else rows.push([s.no,s.n,s.c,s.f,s.feeTotal,"","","","","","",""])});const csv=rows.map(r=>r.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\r\n");download("fee-register.csv","\ufeff"+csv,"text/csv;charset=utf-8");}
render();
</script></body></html>
